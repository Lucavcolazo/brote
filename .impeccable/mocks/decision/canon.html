<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:#F3F4F6;font-family:-apple-system,system-ui,sans-serif;color:#111827}
.card{margin:56px 16px 12px;background:#fff;border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{display:grid;justify-items:center;gap:6px}
.ring{width:84px;height:84px;border-radius:50%;background:conic-gradient(#16A34A 0 70%,#e5e7eb 0);display:grid;place-items:center}
.ring b{width:66px;height:66px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px}
.p span{font-weight:600}.p small{color:#6b7280}
.post{margin:0 16px;background:#fff;border-radius:20px;overflow:hidden}
.ph{height:240px;background:radial-gradient(circle at 50% 50%,#86efac 0 24%,#16a34a 25% 32%,#ecfdf5 33%)}
.meta{padding:14px;font-weight:600}
nav{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;display:flex;justify-content:space-around;align-items:center;padding-bottom:14px}
nav i{width:24px;height:24px;border:2px solid #9ca3af;border-radius:6px;display:block}
nav .fab{width:54px;height:54px;border-radius:50%;background:#16A34A;margin-top:-24px}
</style></head><body>
<div class="card">
 <div class="p"><div class="ring"><b>6</b></div><span>Luca</span><small>Racha 4 días</small></div>
 <div class="p"><div class="ring" style="background:conic-gradient(#16A34A 0 45%,#e5e7eb 0)"><b>4</b></div><span>Giovanna</span><small>Racha 2 días</small></div>
</div>
<div class="post"><div class="ph"></div><div class="meta">Giovanna · Brócoli al vapor</div></div>
<nav><i></i><i></i><span class="fab"></span><i></i><i></i></nav>
</body></html>
